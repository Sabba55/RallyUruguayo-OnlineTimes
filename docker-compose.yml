services:
  frontend:
    image: node:22-alpine
    container_name: rally-dashboard-frontend
    working_dir: /usr/src/app
    volumes:
      - .:/usr/src/app
    command: sh -c "npm install &&
      npx vite build &&
      npx serve -s dist -l 3000"
    ports:
      - "3000:3000"
    restart: always